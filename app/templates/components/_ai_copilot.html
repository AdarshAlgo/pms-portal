<!-- ==============================================================================
     🤖 VIDYA.AI - INTELLIGENT PROJECT ASSISTANT (RBAC & DATABASE GROUNDED)
     ============================================================================== -->

<!-- Floating AI Trigger Button -->
<div id="ai-copilot-trigger-container" class="fixed bottom-6 right-6 z-50">
    <button id="ai-copilot-toggle-btn" 
            class="group flex items-center space-x-2.5 px-4 py-3 rounded-full bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 text-white font-bold text-xs shadow-2xl shadow-indigo-600/40 border border-white/20 hover:scale-105 active:scale-95 transition-all duration-300 ring-2 ring-indigo-400/20"
            title="Open Vidya.ai (Ctrl+K / Cmd+K)">
        <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <i class="fas fa-wand-magic-sparkles text-sm group-hover:rotate-12 transition-transform text-amber-300"></i>
        <span class="tracking-wide">Vidya.ai</span>
        <span class="hidden md:inline-block px-1.5 py-0.5 rounded text-[10px] bg-white/20 font-mono">⌘K</span>
    </button>
</div>

<!-- Floating AI Assistant Drawer / Modal (Compact Default, Resizable to Medium-Large) -->
<div id="ai-copilot-modal" 
     class="fixed bottom-20 right-6 z-50 w-[360px] sm:w-[380px] max-w-[95vw] h-[520px] max-h-[82vh] rounded-3xl bg-white/95 dark:bg-slate-900/95 backdrop-blur-2xl border border-slate-200/90 dark:border-slate-800 shadow-2xl flex flex-col overflow-hidden transition-all duration-300 origin-bottom-right transform scale-0 opacity-0 pointer-events-none ring-1 ring-black/5 dark:ring-white/10">
    
    <!-- Top Header Banner -->
    <div class="p-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-700 text-white flex items-center justify-between shadow-md relative overflow-hidden">
        <div class="absolute -right-8 -top-8 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="flex items-center space-x-2.5 relative z-10 min-w-0">
            <div class="w-8 h-8 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-white border border-white/20 shadow-inner shrink-0">
                <i class="fas fa-brain text-sm text-amber-300"></i>
            </div>
            <div class="min-w-0">
                <div class="flex items-center space-x-1.5">
                    <h3 class="font-extrabold text-sm tracking-tight text-white truncate">Vidya.ai</h3>
                    <span class="px-1.5 py-0.2 rounded text-[9px] font-bold uppercase bg-white/20 text-white font-mono shrink-0">v2.0 PRO</span>
                </div>
                <p class="text-[10px] text-indigo-100 flex items-center mt-0.5 truncate">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1.5 animate-pulse shrink-0"></span>
                    <span id="ai-user-role-badge" class="truncate">Online • Live Grounded</span>
                </p>
            </div>
        </div>
        
        <div class="flex items-center space-x-1.5 relative z-10 shrink-0">
            <!-- 🔲 Medium-Large Size Toggle Button -->
            <button id="ai-copilot-resize-btn" class="w-7 h-7 rounded-lg bg-white/15 hover:bg-white/25 text-white flex items-center justify-center transition-colors text-xs" title="Toggle Medium-Large Size">
                <i id="ai-resize-icon" class="fas fa-up-right-and-down-left-from-center text-[10px]"></i>
            </button>
            <button id="ai-copilot-clear-btn" class="w-7 h-7 rounded-lg bg-white/15 hover:bg-white/25 text-white flex items-center justify-center transition-colors text-xs" title="Clear Chat History">
                <i class="fas fa-rotate-right text-[11px]"></i>
            </button>
            <button id="ai-copilot-close-btn" class="w-7 h-7 rounded-lg bg-white/15 hover:bg-white/25 text-white flex items-center justify-center transition-colors text-xs" title="Close Vidya.ai">
                <i class="fas fa-xmark text-xs"></i>
            </button>
        </div>
    </div>

    <!-- Quick Action Chips (Role-Aware 1-Click Buttons) -->
    <div class="px-3 py-2 bg-slate-50/90 dark:bg-slate-800/60 border-b border-slate-200/80 dark:border-slate-800 overflow-x-auto whitespace-nowrap scrollbar-none flex items-center space-x-2" id="ai-quick-chips">
        <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider shrink-0">⚡ Quick:</span>
        <span class="text-[10px] text-slate-400">Loading actions...</span>
    </div>

    <!-- Message Stream (No horizontal scroll, fully contained) -->
    <div id="ai-chat-stream" class="flex-1 p-3.5 overflow-y-auto overflow-x-hidden space-y-3 text-xs text-slate-800 dark:text-slate-200 scrollbar-thin">
        <!-- Initial Greeting Message -->
        <div class="flex items-start space-x-2.5 w-full max-w-full min-w-0">
            <div class="w-7 h-7 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-600 to-indigo-700 flex items-center justify-center text-white text-xs shrink-0 shadow-sm mt-0.5">
                <i class="fas fa-wand-magic-sparkles text-amber-300 text-[11px]"></i>
            </div>
            <div class="flex-1 min-w-0 max-w-full p-3 rounded-2xl bg-indigo-50/90 dark:bg-slate-800/90 border border-indigo-100 dark:border-slate-700 leading-relaxed shadow-sm overflow-hidden break-words">
                <p class="font-bold text-indigo-700 dark:text-indigo-400 text-xs mb-1">Namaste! I am Vidya.ai 🙏</p>
                <p class="text-[11px] text-slate-700 dark:text-slate-300">
                    Your institutional project assistant. Tap any 1-click action chip above or ask me questions about deadlines, rubrics, active telemetry, or team evaluations.
                </p>
            </div>
        </div>
    </div>

    <!-- Input Box -->
    <div class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
        <form id="ai-copilot-form" class="flex items-center space-x-2">
            <div class="relative flex-1 min-w-0">
                <input type="text" 
                       id="ai-copilot-input" 
                       placeholder="Ask Vidya.ai (e.g., 'at-risk projects', 'rubrics')..." 
                       class="w-full rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3.5 py-2 text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition-all">
            </div>
            <button type="submit" 
                    id="ai-copilot-send-btn"
                    class="w-8 h-8 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition-all shadow-md shadow-indigo-600/30 shrink-0">
                <i class="fas fa-paper-plane text-xs"></i>
            </button>
        </form>
        <div class="flex items-center justify-between mt-2 px-1 text-[10px] text-slate-400 dark:text-slate-500">
            <span>🔒 RBAC Protected</span>
            <span class="font-mono">Local Grounded Engine</span>
        </div>
    </div>

</div>

<!-- Vidya AI Controller Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('ai-copilot-toggle-btn');
    const closeBtn = document.getElementById('ai-copilot-close-btn');
    const clearBtn = document.getElementById('ai-copilot-clear-btn');
    const resizeBtn = document.getElementById('ai-copilot-resize-btn');
    const resizeIcon = document.getElementById('ai-resize-icon');
    const modal = document.getElementById('ai-copilot-modal');
    const chatStream = document.getElementById('ai-chat-stream');
    const chipsContainer = document.getElementById('ai-quick-chips');
    const form = document.getElementById('ai-copilot-form');
    const input = document.getElementById('ai-copilot-input');
    const roleBadge = document.getElementById('ai-user-role-badge');
    let isOpen = false;
    let actionsLoaded = false;
    let isExpanded = false;

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function toggleCopilot() {
        isOpen = !isOpen;
        if (isOpen) {
            modal.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
            modal.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
            input.focus();
            if (!actionsLoaded) {
                fetchAvailableActions();
            }
        } else {
            modal.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
            modal.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
        }
    }

    if (toggleBtn) toggleBtn.addEventListener('click', toggleCopilot);
    if (closeBtn) closeBtn.addEventListener('click', toggleCopilot);

    // 🔲 Medium-Large Window Resize Toggle
    if (resizeBtn) {
        resizeBtn.addEventListener('click', function() {
            isExpanded = !isExpanded;
            if (isExpanded) {
                modal.classList.remove('w-[360px]', 'sm:w-[380px]', 'h-[520px]');
                modal.classList.add('w-[560px]', 'sm:w-[620px]', 'h-[640px]', 'max-h-[88vh]');
                if (resizeIcon) resizeIcon.className = 'fas fa-down-left-and-up-right-to-center text-[10px]';
                resizeBtn.title = 'Switch to Compact View';
            } else {
                modal.classList.remove('w-[560px]', 'sm:w-[620px]', 'h-[640px]', 'max-h-[88vh]');
                modal.classList.add('w-[360px]', 'sm:w-[380px]', 'h-[520px]');
                if (resizeIcon) resizeIcon.className = 'fas fa-up-right-and-down-left-from-center text-[10px]';
                resizeBtn.title = 'Switch to Medium-Large View';
            }
        });
    }

    // Keyboard shortcut Ctrl+K or Cmd+K
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            toggleCopilot();
        }
    });

    if (clearBtn) {
        clearBtn.addEventListener('click', function() {
            chatStream.innerHTML = `
                <div class="flex items-start space-x-2.5 w-full max-w-full min-w-0">
                    <div class="w-7 h-7 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-600 to-indigo-700 flex items-center justify-center text-white text-xs shrink-0 shadow-sm mt-0.5">
                        <i class="fas fa-wand-magic-sparkles text-amber-300 text-[11px]"></i>
                    </div>
                    <div class="flex-1 min-w-0 max-w-full p-3 rounded-2xl bg-indigo-50/90 dark:bg-slate-800/90 border border-indigo-100 dark:border-slate-700 leading-relaxed shadow-sm overflow-hidden break-words">
                        <p class="font-bold text-indigo-700 dark:text-indigo-400 text-xs mb-1">Chat Cleared</p>
                        <p class="text-[11px] text-slate-700 dark:text-slate-300">
                            Select a 1-click preset chip above or type any query to begin.
                        </p>
                    </div>
                </div>
            `;
        });
    }

    // Fetch Role-Aware Quick Actions
    function fetchAvailableActions() {
        fetch('/api/agent/actions')
            .then(res => {
                if (!res.ok) throw new Error('Unauthenticated');
                return res.json();
            })
            .then(data => {
                actionsLoaded = true;
                if (data.role && roleBadge) {
                    const roleTitle = data.role.toUpperCase();
                    roleBadge.textContent = `${roleTitle} Clearance • ${data.user_name || 'User'}`;
                }

                chipsContainer.innerHTML = '<span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider shrink-0">⚡ Quick:</span>';
                if (data.actions && data.actions.length > 0) {
                    data.actions.forEach(action => {
                        const btn = document.createElement('button');
                        btn.className = `px-2.5 py-1 rounded-xl text-[10px] font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-400 dark:hover:border-indigo-400 text-slate-700 dark:text-slate-200 transition-all shrink-0 shadow-sm hover:scale-105 active:scale-95 flex items-center space-x-1.5`;
                        btn.innerHTML = `<i class="${action.icon} text-indigo-500"></i><span>${action.label}</span>`;
                        btn.addEventListener('click', () => triggerAction(action.id, action.label));
                        chipsContainer.appendChild(btn);
                    });
                }
            })
            .catch(err => {
                chipsContainer.innerHTML = '<span class="text-[10px] text-slate-400">Sign in to view personalized 1-click actions</span>';
            });
    }

    // Append user query bubble (strictly contained, no overflow)
    function appendUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'flex justify-end w-full max-w-full';
        div.innerHTML = `
            <div class="p-2.5 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 text-white text-xs max-w-[85%] shadow-md leading-relaxed break-words">
                ${text}
            </div>
        `;
        chatStream.appendChild(div);
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    // Append AI response bubble (strictly contained, no overflow)
    function appendAIMessage(htmlContent) {
        const div = document.createElement('div');
        div.className = 'flex items-start space-x-2.5 animate-fade-in-up w-full max-w-full min-w-0';
        div.innerHTML = `
            <div class="w-7 h-7 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-600 to-indigo-700 flex items-center justify-center text-white text-xs shrink-0 shadow-sm mt-0.5">
                <i class="fas fa-wand-magic-sparkles text-amber-300 text-[11px]"></i>
            </div>
            <div class="flex-1 min-w-0 max-w-full p-3 rounded-2xl bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 leading-relaxed shadow-sm overflow-hidden break-words">
                ${htmlContent}
            </div>
        `;
        chatStream.appendChild(div);
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    // Append Thinking / Processing Indicator
    function appendLoading() {
        const id = 'ai-loading-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.className = 'flex items-start space-x-2.5 animate-pulse w-full max-w-full min-w-0';
        div.innerHTML = `
            <div class="w-7 h-7 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-600 to-indigo-700 flex items-center justify-center text-white text-xs shrink-0 shadow-md">
                <i class="fas fa-brain text-amber-300 text-xs"></i>
            </div>
            <div class="flex-1 min-w-0 max-w-full p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300 flex items-center space-x-2 shadow-sm overflow-hidden break-words">
                <div class="flex space-x-1 items-center shrink-0">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 animate-bounce" style="animation-delay: 0ms;"></span>
                    <span class="w-2 h-2 rounded-full bg-purple-500 animate-bounce" style="animation-delay: 150ms;"></span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-bounce" style="animation-delay: 300ms;"></span>
                </div>
                <span class="text-[11px] ml-1.5 font-medium text-slate-500 dark:text-slate-400 truncate">Vidya.ai is querying database...</span>
            </div>
        `;
        chatStream.appendChild(div);
        chatStream.scrollTop = chatStream.scrollHeight;
        return id;
    }

    function removeLoading(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    // Trigger 1-click action with natural 1.2s - 1.5s thinking delay
    async function triggerAction(actionId, label) {
        appendUserMessage(label);
        const loadingId = appendLoading();
        
        // Exact 1.2s to 1.5s natural thinking delay requested by user
        const naturalDelay = sleep(1200 + Math.random() * 300);

        try {
            const fetchPromise = fetch('/api/agent/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action_id: actionId })
            }).then(res => res.json());

            const [data] = await Promise.all([fetchPromise, naturalDelay]);
            removeLoading(loadingId);
            appendAIMessage(data.html);
        } catch(err) {
            removeLoading(loadingId);
            appendAIMessage("<p class='text-xs text-rose-500'><i class='fas fa-circle-exclamation mr-1'></i> Request failed. Please check connection.</p>");
        }
    }

    // Handle form submit with natural 1.2s - 1.5s thinking delay
    if (form) {
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendUserMessage(text);
            const loadingId = appendLoading();

            // Exact 1.2s to 1.5s natural thinking delay requested by user
            const naturalDelay = sleep(1200 + Math.random() * 300);

            try {
                const fetchPromise = fetch('/api/agent/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                }).then(res => res.json());

                const [data] = await Promise.all([fetchPromise, naturalDelay]);
                removeLoading(loadingId);
                appendAIMessage(data.html);
            } catch(err) {
                removeLoading(loadingId);
                appendAIMessage("<p class='text-xs text-rose-500'><i class='fas fa-circle-exclamation mr-1'></i> Request failed. Please check connection.</p>");
            }
        });
    }
});
</script>
