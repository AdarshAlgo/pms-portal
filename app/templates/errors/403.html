{% extends "base.html" %}

{% block title %}403 - Forbidden Access{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center text-center px-4">
    <div class="w-24 h-24 rounded-full bg-red-100 flex items-center justify-center text-red-600 mb-6">
        <i class="fas fa-shield-alt text-4xl"></i>
    </div>
    <h1 class="text-6xl font-black text-gray-800 tracking-tight mb-2">403</h1>
    <h2 class="text-2xl font-bold text-gray-700 mb-3">Access Forbidden</h2>
    <p class="text-gray-500 max-w-md mb-8">
        You do not have the required role or security permissions to access this academic dashboard.
    </p>
    <div class="flex space-x-4">
        <a href="javascript:history.back()" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium rounded-lg transition-colors">
            <i class="fas fa-arrow-left mr-2"></i>Go Back
        </a>
        <a href="{{ url_for('auth.login') }}" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition-colors">
            <i class="fas fa-home mr-2"></i>Return Home
        </a>
    </div>
</div>
{% endblock %}
